server.port=8088

# AI API Base URL
# 환경변수 AI_BASE_URL이 없으면 기본값 localhost:8000 사용
ai.base-url=${AI_BASE_URL:http://localhost:8000}

# DB 설정 (로컬)
spring.datasource.url=jdbc:mysql://localhost:3308/hackathon?useSSL=false&serverTimezone=Asia/Seoul
spring.datasource.username=team25
spring.datasource.password=team25

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true