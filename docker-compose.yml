services:
  ai-chatbot:
    build: ./ai-chatbot
    env_file: ./.env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
    ports:
      - "${AI_CHATBOT_PORT:-8001}:8001"

  ai-vision:
    build: ./ai-vision-service
    env_file: ./.env
    environment:
      MODEL_PTH_PATH: ${MODEL_PTH_PATH}
      CLASS_MAP_PATH: ${CLASS_MAP_PATH}
      NUM_CLASSES: ${NUM_CLASSES}
      TRAIN_ON_START: ${TRAIN_ON_START}
      PRETRAINED: ${PRETRAINED}
      FREEZE_BACKBONE: ${FREEZE_BACKBONE}
      MAX_TRAIN_SAMPLES: ${MAX_TRAIN_SAMPLES}
      EPOCHS: ${EPOCHS}
      BATCH_SIZE: ${BATCH_SIZE}
      LR: ${LR}
      NUM_WORKERS: ${NUM_WORKERS}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
    volumes:
      - ./ai-vision-service/data:/app/data:ro
      - ./ai-vision-service/index:/app/index
      - ./ai-vision-service/models:/app/models
    ports:
      - "${AI_PORT:-8000}:8000"

  spring:
    build: ./backend-spring
    env_file: ./.env
    environment:
      AI_BASE_URL: ${AI_BASE_URL}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      - ai-vision
      - db
    ports:
      - "${SPRING_PORT:-8081}:8080"
    # DB가 ready 될 때까지 기다리도록 entrypoint 수정
    entrypoint: ["./wait-for-it.sh", "db:3306", "--timeout=60", "--strict", "--", "java", "-jar", "app.jar"]

  nginx:
    build: ./nginx
    env_file: ./.env
    depends_on:
      - ai-chatbot
      - ai-vision
      - spring
    ports:
      - "${NGINX_PORT:-8085}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

  db:
    image: mysql:8.0
    container_name: hackathon_test-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hackathon
      MYSQL_USER: team25
      MYSQL_PASSWORD: team25
    ports:
      - "3308:3306"  # 로컬에서 3308 포트로 접속
    volumes:
      - db_data:/var/lib/mysql 
      - ./db_init.sql:/docker-entrypoint-initdb.d/db_init.sql  # 초기 데이터
  
volumes:
  db_data: